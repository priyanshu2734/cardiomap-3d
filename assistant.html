$("bLink").onclick=()=>cur()&&copyLink(cur().id);$("bDel").onclick=()=>cur()&&delChat(cur().id);$("bRep").onclick=report;
$("bRen").onclick=()=>{const c=cur(),n=c&&prompt("Rename chat",c.title);if(n&&n.trim()){c.title=n.trim().slice(0,80);save();renderLog()}};
$("bExp").onclick=()=>{const c=cur();if(!c||!c.msgs.length)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["# "+c.title+"\n\n"+c.msgs.map(m=>"**"+(m.role=="user"?"You":"CardioMap Assistant")+"**\n\n"+m.content).join("\n\n---\n\n")],{type:"text/markdown"}));a.download="cardiomap-chat-"+c.id+".md";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
$("clearAll").onclick=()=>{if(!S.chats.length||!confirm("Delete ALL saved chats in this browser? This cannot be undone."))return;if(busy)ctl.abort();S={cur:null,chats:[]};save();newChat();toast("History deleted")};
$("bTheme").onclick=()=>{const d=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=d;try{LS.setItem("cm-theme",d)}catch(e){}};
$("conn").onclick=()=>{const v=$("apiurl").value.trim().replace(/\/$/,"");v?LS.setItem(KA,v):LS.removeItem(KA);stat()};
$("prov").onchange=e=>{set.prov=e.target.value;saveSet();provSync()};$("tCtx").onchange=e=>{set.ctx=e.target.checked;saveSet()};$("tMem").onchange=e=>{set.mem=e.target.checked;saveSet()};
addEventListener("hashchange",()=>{const m=location.hash.match(/c=([a-z0-9]+)/);if(m&&m[1]!=S.cur){if(S.chats.some(c=>c.id==m[1]))go(m[1]);else toast("That chat is not saved in this browser.",1)}});
addEventListener("storage",e=>{if(e.key==KX)ctxInfo()});
/* ---- init ---- */
$("prov").value=set.prov;provSync();$("tCtx").checked=set.ctx;$("tMem").checked=set.mem;
$("back").href=location.pathname.startsWith("/assistant")?"/app":"index.html";
const h=(location.hash.match(/c=([a-z0-9]+)/)||[])[1];
if(h&&!S.chats.some(c=>c.id==h))setTimeout(()=>toast("That chat is not saved in this browser.",1),400);
const start=S.chats.some(c=>c.id==h)?h:S.chats.some(c=>c.id==S.cur)?S.cur:S.chats[0]&&S.chats[0].id;
start?go(start):newChat();ctxInfo();stat();
</script><script src="/static/shell.js?v=20261004d"></script></body></html>
